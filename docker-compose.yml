version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: awra-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - IPINFO_API_KEY=${IPINFO_API_KEY}
      - AWRA_JWT_SECRET=${AWRA_JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ANALYST_EMAIL=${ANALYST_EMAIL}
      - ANALYST_PASSWORD=${ANALYST_PASSWORD}
      - AWRA_API_KEY=${AWRA_API_KEY}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - ./backend/data:/app/data
      # Mount the db files to persist data across container restarts
      - ./backend/incidents.db:/app/incidents.db
      - ./backend/ioc_cache.db:/app/ioc_cache.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awra-frontend
    ports:
      - "3001:3000"
    environment:
      - AWRA_JWT_SECRET=${AWRA_JWT_SECRET}
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
